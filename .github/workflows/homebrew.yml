name: Update Homebrew Formula

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tarball SHA256
        id: sha
        run: |
          TAG="${{ github.event.release.tag_name }}"
          URL="https://github.com/jacopobonomi/venv_manager/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sSL "$URL" | sha256sum | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update tap formula
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          script: |
            const owner = 'jacopobonomi';
            const repo  = 'homebrew-tap';
            const path  = 'Formula/venv-manager.rb';
            const tag   = '${{ steps.sha.outputs.tag }}';
            const url   = '${{ steps.sha.outputs.url }}';
            const sha   = '${{ steps.sha.outputs.sha }}';

            const { data: file } = await github.rest.repos.getContent({ owner, repo, path });
            let content = Buffer.from(file.content, 'base64').toString();

            content = content
              .replace(/url\s+"[^"]*"/,  `url "${url}"`)
              .replace(/sha256\s+"[^"]*"/, `sha256 "${sha}"`);

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `chore: bump venv-manager to ${tag}`,
              content: Buffer.from(content).toString('base64'),
              sha: file.sha,
            });
            core.info(`Updated ${path} for ${tag}`);
